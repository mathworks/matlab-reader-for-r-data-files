name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build validation toolbox
    runs-on: ubuntu-latest
    env:
      # Validation artifact only; release tags determine published versions.
      RDATAREADER_VERSION: v0.0.0
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install help build dependency
        run: python -m pip install -r tools/requirements-build.txt
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Build toolbox
        uses: matlab-actions/run-build@v3
        with:
          tasks: archive
      - name: Verify packaged content
        run: python tools/verify_package.py releases/rDataReader.mltbx
      - uses: actions/upload-artifact@v7
        with:
          name: validation-toolbox
          path: releases/rDataReader.mltbx
          if-no-files-found: error

  test:
    name: MATLAB ${{ matrix.release }} (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        release: [R2025a, R2026b]
        include:
          - os: ubuntu-22.04
            release: R2023a
          - os: windows-2022
            release: R2023a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
      - uses: actions/download-artifact@v7
        with:
          name: validation-toolbox
          path: validation-toolbox
      - name: Run complete test suite
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); runValidation
      - name: Verify installed toolbox in a fresh session
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); verifyInstalledToolbox(fullfile('validation-toolbox', 'rDataReader.mltbx'))
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.release }}-${{ matrix.os }}
          path: public/
          if-no-files-found: warn
