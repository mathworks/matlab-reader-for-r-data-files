name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MATLAB ${{ matrix.release }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        release: [R2025a, R2026b]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
      
      - name: Run complete test suite
        if: matrix.release == 'R2023b'
        uses: matlab-actions/run-command@v3
        with:
          command: |
            project = matlab.project.createProject(Folder=root, Name="rdatareader");
            addPath(project, fullfile(root, "tbx", "rdatareader"));
            addPath(project, fullfile(root, "tbx", "doc"));
            addPath(project, fullfile(root, "tests"));

      - name: Run build
        uses: matlab-actions/run-build@v3
        with:
          tasks: test

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.release }}-${{ matrix.os }}
          path: public/
          if-no-files-found: warn
